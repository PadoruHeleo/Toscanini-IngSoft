[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "tauri-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [] }
# tauri-plugin-opener = "1"  # Comentado temporalmente - requiere configuración diferente en Tauri 1.x
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.5", features = ["runtime-tokio-rustls", "mysql", "chrono", "uuid", "migrate"] }
tokio = { version = "1.0", features = ["full"] }
dotenv = "0.15"
chrono = { version = "=0.4.15", features = ["serde"], default-features = false }
chrono-tz = "0.6"
bcrypt = "0.15"
resend-rs = "0.15.0"
uuid = { version = "1.0", features = ["v4"] }
rand = "0.8"
aes-gcm = "0.10"
keyring = "2.3"
base64 = "0.22"
sha2 = "0.10"
dirs = "5.0"
printpdf = "0.7"
reqwest = { version = "0.11", features = ["json"] }
log = "0.4"
simplelog = "0.12"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["sysinfoapi", "winnt", "errhandlingapi"] }

[[bin]]
name = "tauri-app"
path = "src/main.rs"
