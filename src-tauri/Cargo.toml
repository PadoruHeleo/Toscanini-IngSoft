[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "tauri-app"
rust-version = "1.77.2"

[workspace]
# Resolver version-aware de Cargo 1.84+ que considera rust-version
resolver = "2"

[resolver]
incompatible-rust-versions = "fallback"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.1", features = [] }

[dependencies]
tauri-plugin-notification = { version = "2.0.0", features = [ "windows7-compat" ] }
tauri = { version = "2.0.1", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "chrono", "uuid", "migrate"] }
tokio = { version = "1.0", features = ["full"] }
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
bcrypt = "0.15"
mail-send = "0.4"
mail-builder = "0.3"
uuid = { version = "1.0", features = ["v4"] }
home = "0.5.9"
rand = "0.8"
aes-gcm = "0.10"
keyring = "2.3"
base64 = "0.22"
sha2 = "0.10"
dirs = "5.0"
printpdf = "0.7"
reqwest = { version = "0.11", features = ["json"] }
icu_normalizer = "=1.5.0"
icu_collections = "=1.5.0"
icu_normalizer_data = "=1.5.0"
icu_properties_data = "=1.5.1"
icu_properties = "=1.5.1"
icu_provider = "=1.5.0"
idna_adapter = "=1.2.0"
litemap = "=0.7.4"

[[bin]]
name = "tauri-app"
path = "src/main.rs"
